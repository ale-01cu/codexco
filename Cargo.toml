[package]
name = "codexco"
version = "0.1.0"
edition = "2021"
authors = ["Ale z17"]
description = "Calculador y monitor de costos de sesiones para Codex"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2.5"
colored = "2.1"
dirs = "5.0"
